version: 1
approval: Maintainer requested CKA and CKS playgrounds and graded labs on 2026-10-13,
  superseding the earlier reading-only scope.
course:
  id: ATS025
  certification:
    name: Certified Kubernetes Administrator
    code: CKA
    provider: CNCF / Linux Foundation
    domain: Cluster Architecture, Installation & Configuration
    weight: 25
    competencies:
    - Manage role based access control (RBAC)
    - Prepare underlying infrastructure for installing a Kubernetes cluster
    - Create and manage Kubernetes clusters using kubeadm
    - Manage the lifecycle of Kubernetes clusters
    - Implement and configure a highly-available control plane
    - Use Helm and Kustomize to install cluster components
    - Understand extension interfaces (CNI, CSI, CRI, etc.)
    - Understand CRDs, install and configure operators
defaults:
  playground: true
  module_lab: false
  capstone: false
  section_quiz: true
  final_quiz: true
assessment_format: YAML question banks, schema version 1; indexed in assessments/index.yaml
