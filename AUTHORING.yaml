  curriculum_item: Manage role based access control (RBAC)
  capstone: false
  section_quiz: true
  modules:
  - id: module-01
    title: Role Rules, Bindings And Administrative Authority
    objectives:
    - Explain roles, bindings and scope.
    - Evaluate additive effective grants.
    - Identify indirect privilege through workload creation.
    - Choose least privilege for an administrative responsibility.
    outline:
    - RBAC Grants And Their Consequences
    - RBAC Scope And Least Privilege
    playground: true
    module_lab: true
    sources:
