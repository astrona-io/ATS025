# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Kernel Modules, sysctl, Swap And The cgroup Driver (PLAYGROUND).
# A clean sandbox: one kubeadm-built kind node and an empty host-readiness
# record. No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-025-playground-020-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f

bootstrap:
  manifests:
    - name: host-readiness
      type: file
      source: manifests/start.yaml

teardown:
  keepCluster: false
