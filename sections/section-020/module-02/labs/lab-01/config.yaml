# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Record Host Readiness From The API (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-025-lab-020-02-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f

# Starting state: a stale host-readiness record from an earlier review.
bootstrap:
  init:
    - name: seed-stale-record
      description: Create the stale record and remember the kubelet configuration
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: record-complete
      description: The host-readiness record has all six keys and no stale value
      type: file
      source: validation/validate-record-complete.sh
      hint: Keep the ConfigMap host-readiness in starfleet and give every key a value read from the cluster. Stale values from the earlier review are rejected.
    - name: cgroup-driver
      description: cgroupDriver matches the stored kubelet configuration
      type: file
      source: validation/validate-cgroup-driver.sh
      hint: Read the kubelet key of the ConfigMap kubelet-config in kube-system and copy the cgroupDriver line.
    - name: swap-setting
      description: failSwapOn matches the stored kubelet configuration
      type: file
      source: validation/validate-fail-swap-on.sh
      hint: Read failSwapOn from the same configuration. If the field is absent, the kubelet default is true.
    - name: runtime-and-kubelet
      description: containerRuntimeVersion and kubeletVersion match the node status
      type: file
      source: validation/validate-runtime-kubelet.sh
      hint: Both values are in status.nodeInfo of the node. Copy them exactly, including the containerd:// prefix.
    - name: kernel-and-os
      description: kernelVersion and osImage match the node status
      type: file
      source: validation/validate-kernel-os.sh
      hint: Both values are in status.nodeInfo of the node. Copy them exactly.
    - name: kubelet-config-untouched
      description: The kubelet-config ConfigMap was not edited to fit the record
      type: file
      source: validation/validate-kubelet-config-untouched.sh
      hint: Fix the record, not the cluster. The kubelet-config ConfigMap must keep its original content.

teardown:
  keepCluster: false
