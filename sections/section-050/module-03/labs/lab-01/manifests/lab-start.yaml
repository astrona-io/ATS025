apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout-controller
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scout-edit
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: scout-controller
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane-health
  namespace: starfleet
data:
  schedulerLeader: unknown
  controllerManagerLeader: unknown
  leaseDurationSeconds: unknown
  leaderElectFlag: unknown
  apiServerLivenessPath: unknown
  apiServerReadinessPath: unknown
  apiServerEndpointCount: unknown
