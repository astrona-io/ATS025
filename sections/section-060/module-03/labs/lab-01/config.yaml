# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Build A Kustomize Overlay (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-025-lab-060-03-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/busybox:1.37.0

# Starting state: empty starfleet and outpost namespaces and one unrelated Deployment named bridge in starfleet.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the namespaces and the unrelated bridge Deployment
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: namespace-and-names
      description: "Deployment and Service outpost-shuttle exist in outpost and nothing named shuttle exists in default"
      type: file
      source: validation/validate-names.sh
      hint: "Set namespace outpost and namePrefix outpost- in the overlay kustomization."
    - name: replicas-and-image
      description: "The Deployment has 3 available replicas and runs docker.io/library/busybox:1.37.0"
      type: file
      source: validation/validate-workload.sh
      hint: "Use the images transformer and set replicas to 3."
    - name: labels-and-service
      description: "Deployment, pods and Service selector carry environment: outpost and the Service has endpoints"
      type: file
      source: validation/validate-labels.sh
      hint: "Use labels with includeSelectors and includeTemplates set to true."
    - name: strategic-patch
      description: "The container has the memory limit 64Mi and the cpu limit 100m"
      type: file
      source: validation/validate-limits.sh
      hint: "Add a strategic merge patch that names the container shuttle."
    - name: json-patch
      description: "The Service listens on port 8080 and still targets the container port"
      type: file
      source: validation/validate-service-port.sh
      hint: "Add a JSON 6902 patch with target kind Service and op replace on /spec/ports/0/port."
    - name: generated-config
      description: "A ConfigMap with a hash suffix holds MODE=patrol and the Deployment refers to exactly that name"
      type: file
      source: validation/validate-config.sh
      hint: "Merge MODE=patrol into the base generator; Kustomize rewrites the reference."

teardown:
  keepCluster: false
