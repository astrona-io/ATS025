# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Audit Component Versions Before An Upgrade (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-025-lab-040-02-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f

# Starting state: a stale upgrade-review record from an earlier cluster.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the stale upgrade review
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: record-complete
      description: "The review has all nine keys and no stale value"
      type: file
      source: validation/validate-record-complete.sh
      hint: "Keep the ConfigMap upgrade-review in starfleet and give every key a value read from the cluster."
    - name: control-plane-versions
      description: "The API server, controller manager and scheduler versions match their pod images"
      type: file
      source: validation/validate-control-plane-versions.sh
      hint: "Read the image of each static pod in kube-system. The version is the tag after the last colon."
    - name: proxy-and-kubelet
      description: "kubeProxyVersion and kubeletVersion match the cluster"
      type: file
      source: validation/validate-proxy-and-kubelet.sh
      hint: "kube-proxy is a DaemonSet in kube-system. The kubelet version is in the node status."
    - name: stored-version
      description: "storedVersion matches the ClusterConfiguration in kubeadm-config"
      type: file
      source: validation/validate-stored-version.sh
      hint: "Read kubernetesVersion in the ClusterConfiguration key of the kubeadm-config ConfigMap."
    - name: skew-window
      description: "oldestKubelet and nextMinor follow from the API server version"
      type: file
      source: validation/validate-skew-window.sh
      hint: "The kubelet may be three minor versions older than the API server. kubeadm upgrades one minor version at a time. Write minors as 1.NN without the v."
    - name: kubeadm-config-untouched
      description: "The kubeadm-config ConfigMap was not edited to fit the record"
      type: file
      source: validation/validate-kubeadm-config-untouched.sh
      hint: "Fix the record, not the cluster."

teardown:
  keepCluster: false
