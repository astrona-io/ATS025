# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Snapshot etcd And Record The Restore Facts (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-025-lab-040-03-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f

# Starting state: a stale etcd-recovery record from an earlier cluster.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the stale recovery record
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: record-complete
      description: "The record has all eight keys and no stale value"
      type: file
      source: validation/validate-record-complete.sh
      hint: "Keep the ConfigMap etcd-recovery in starfleet and give every key a value read from the cluster."
    - name: etcd-flags
      description: "dataDir, memberName, trustedCaFile and peerUrl match the etcd pod flags"
      type: file
      source: validation/validate-etcd-flags.sh
      hint: "Read --data-dir, --name, --trusted-ca-file and --initial-advertise-peer-urls on the etcd pod."
    - name: etcd-volumes
      description: "dataHostPath and certHostPath match the hostPath volumes of the etcd pod"
      type: file
      source: validation/validate-etcd-volumes.sh
      hint: "Read the volumes etcd-data and etcd-certs in the etcd pod spec."
    - name: snapshot-file
      description: "A valid snapshot exists at /tmp/recovery-snapshot.db in the etcd pod"
      type: file
      source: validation/validate-snapshot-file.sh
      hint: "Run etcdctl snapshot save in the etcd pod with the endpoint, CA, client certificate and key, then check it with etcdutl snapshot status."
    - name: snapshot-record
      description: "snapshotRevision and snapshotTotalKeys match the snapshot file"
      type: file
      source: validation/validate-snapshot-record.sh
      hint: "Run etcdutl snapshot status with --write-out=json on the file and copy the revision and totalKey values."
    - name: cluster-healthy
      description: "The API server is ready and the live etcd data directory is unchanged"
      type: file
      source: validation/validate-cluster-healthy.sh
      hint: "Do not restore over the live data. Restore, if you want to try it, into a scratch directory."

teardown:
  keepCluster: false
