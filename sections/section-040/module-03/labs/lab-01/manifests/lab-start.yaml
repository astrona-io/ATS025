apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-recovery
  namespace: starfleet
data:
  dataDir: /var/lib/old-etcd
  memberName: old-member
  trustedCaFile: /etc/old/ca.crt
  peerUrl: https://10.0.0.1:2380
  dataHostPath: /var/lib/old-etcd
  certHostPath: /etc/old/pki
  snapshotRevision: "1"
  snapshotTotalKeys: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: probe
          image: docker.io/library/busybox:1.37.0
          command: ["sleep", "infinity"]
