# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Cluster-Scoped Access (PLAYGROUND). A clean sandbox: it starts the
# starting objects and then stays running for free exploration. No task, no
# grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-025-playground-010-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - curlimages/curl:8.22.0

# What the learner starts with: ServiceAccounts `scout` (no rights) and
# `rolemaker` (may create Roles and RoleBindings in starfleet), a Secret, two
# PersistentVolumes and a drifter client in outpost.
bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/drifter
      namespace: outpost

teardown:
  keepCluster: false
