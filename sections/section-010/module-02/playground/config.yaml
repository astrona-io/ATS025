# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Users, Client Certificates And ServiceAccount Tokens (PLAYGROUND).
# A clean sandbox: it starts the example workloads and then stays running for
# free exploration. No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-025-playground-010-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

# What the learner starts with: the example workloads, the ServiceAccounts
# `shuttle`, `probe` (token mounting switched off) and `drifter`, and no Role
# or RoleBinding of its own.
bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost

teardown:
  keepCluster: false
