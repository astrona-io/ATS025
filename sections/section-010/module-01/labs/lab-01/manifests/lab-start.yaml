# Starting state: two namespaces, the ServiceAccount shuttle, a Secret and a
# leftover RoleBinding in outpost that gives shuttle the built-in edit role.
# The leftover binding is on purpose. No Role of the task exists.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle
  namespace: starfleet
---
apiVersion: v1
kind: Secret
metadata:
  name: warp-key
  namespace: starfleet
type: Opaque
stringData:
  key: not-a-real-key
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shuttle-helper
  namespace: outpost
subjects:
  - kind: ServiceAccount
    name: shuttle
    namespace: starfleet
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
