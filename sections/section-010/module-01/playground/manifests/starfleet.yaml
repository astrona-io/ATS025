# Starting state for the Roles and RoleBindings playground: two namespaces,
# two ServiceAccounts with no rights, a Secret and two client Deployments.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout
  namespace: starfleet
---
apiVersion: v1
kind: Secret
metadata:
  name: warp-key
  namespace: starfleet
type: Opaque
stringData:
  key: not-a-real-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: curlimages/curl:8.22.0
          command: ["sleep", "86400"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drifter
  template:
    metadata:
      labels:
        app: drifter
    spec:
      containers:
        - name: drifter
          image: curlimages/curl:8.22.0
          command: ["sleep", "86400"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
