# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Installing And Configuring An Operator (PLAYGROUND). Clean sandbox: no task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-025-playground-080-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/busybox:1.37.0

bootstrap:
  manifests:
    - name: operator
      type: file
      source: manifests/operator.yaml
  waitFor:
    - resource: deploy/beacon-operator
      namespace: beacon-system

teardown:
  keepCluster: false
