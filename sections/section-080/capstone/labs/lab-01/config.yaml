# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Publish A Custom Type And Install Its Operator (CAPSTONE). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-025-lab-080-capstone-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/busybox:1.37.0

# Starting state: two namespaces and an operator Deployment that has no CRD, no identity and no permissions.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the namespaces and the unwired operator Deployment
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: crd-and-schema
      description: "The Mission CRD is established and its schema rejects bad phase and crewSize values"
      type: file
      source: validation/validate-crd-schema.sh
      hint: "Create missions.training.astrona.io with phase enum Planned, Active and Done and crewSize from 1 through 20."
    - name: defaults-and-immutable
      description: "crewSize defaults to 3 and callSign cannot change after creation"
      type: file
      source: validation/validate-defaults-immutable.sh
      hint: "Use default: 3 and a CEL rule on spec that compares self.callSign with oldSelf.callSign."
    - name: subresource-and-columns
      description: "The status subresource and the Phase and Crew columns exist"
      type: file
      source: validation/validate-subresource-columns.sh
      hint: "Add subresources status and additionalPrinterColumns for .spec.phase and .spec.crewSize."
    - name: operator-identity
      description: "The operator Deployment uses the ServiceAccount mission-operator and is available"
      type: file
      source: validation/validate-identity.sh
      hint: "Create the ServiceAccount in mission-system and set it on the Deployment."
    - name: operator-permissions
      description: "The ServiceAccount has the loop permissions and nothing wider"
      type: file
      source: validation/validate-permissions.sh
      hint: "Grant missions, missions/status, leases and events; do not use wildcards."
    - name: first-mission
      description: "A Mission named apollo exists in starfleet with phase Planned and the default crew"
      type: file
      source: validation/validate-first-mission.sh
      hint: "Create the object after the CRD is established and leave crewSize out."

teardown:
  keepCluster: false
